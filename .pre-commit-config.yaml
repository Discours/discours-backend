repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-ast
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
        name: ruff lint with fixes
        args: [
          --fix,
          --ignore, UP035,
          --ignore, UP006,
          --ignore, TRY400,
          --ignore, TRY401,
          --ignore, FBT001,
          --ignore, FBT002,
          --ignore, ARG002,
          --ignore, SLF001,
          --ignore, RUF012,
          --ignore, RUF013,
          --ignore, PERF203,
          --ignore, PERF403,
          --ignore, SIM105,
          --ignore, SIM108,
          --ignore, SIM118,
          --ignore, S110,
          --ignore, PLR0911,
          --ignore, RET504,
          --ignore, INP001,
          --ignore, F811,
          --ignore, F841,
          --ignore, B012,
          --ignore, E712,
          --ignore, ANN001,
          --ignore, ANN201,
          --ignore, SIM102,
          --ignore, FBT003
        ]
      - id: ruff-format
        name: ruff format

